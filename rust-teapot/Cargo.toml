[package]
name = "rust-teapot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiss3d = "0.35"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

# For math operations - nalgebra is re-exported by kiss3d
[dependencies.nalgebra]
version = "0.30"
features = ["serde-serialize"]

# Web-sys features needed for canvas and WebGL
[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
]
